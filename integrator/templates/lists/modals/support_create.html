{% load static %}
<div class="modal fade zoomIn" id="showModalAddSupport" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0">
            <div class="modal-header p-3 bg-info-subtle">
                <h5 class="modal-title" id="exampleModalLabel">Новая поддержка</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="close-modal"></button>
            </div>
            <form method="POST" enctype="multipart/form-data" class="tablelist-form" autocomplete="off" id="add-support-form">
                {% csrf_token %}
                <div class="modal-body">
                  <div class="row-g-3">
                      <div class="col-lg-12 mt-3">
                        <h6 class="fw-semibold">Наименование:</h6>
                        <input type="text" name="name" class="form-control" maxlength="250" required="" id="name">
                      </div>
                  </div>
                  <div class="col-lg-12 mt-3">
                    <h6 class="fw-semibold">Приоритет:</h6>
                    <input type="number" name="priority" id="priority" class="form-control" value="0"  required>
                  </div>
                </div>
                <div class="modal-footer">
                    <div class="hstack gap-2 justify-content-end">
                        <button type="button" class="btn btn-light" id="close-support-modal" data-bs-dismiss="modal">Отмена</button>
                        <button type="submit" class="btn btn-success" id="add-support-btn">Создать</button>
                        <!-- <button type="button" class="btn btn-success" id="edit-btn">Update Task</button> -->
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
<script type="text/javascript">
  $(document).ready(function(){
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            document.cookie.split(';').forEach(cookie => {
                cookie = cookie.trim();
                if (cookie.startsWith(name + '=')) {
                    cookieValue = decodeURIComponent(cookie.split('=')[1]);
                }
            });
        }
        return cookieValue;
    }


    $('#add-support-form').on('submit', function(evn) {
      evn.preventDefault();
      let submitButton = $('#add-support-btn'); // Убедитесь, что у кнопки отправки есть id='submit-button'
      submitButton.prop('disabled', true);
      // Сохраняем текст, если надо восстановить потом
      let originalText = submitButton.html();

      // Блокируем и добавляем фиксированные размеры
      let buttonWidth = submitButton.outerWidth();
      let buttonHeight = submitButton.outerHeight();

      submitButton.prop('disabled', true).css({
        width: buttonWidth,
        height: buttonHeight
      }).html(`
        <span class="d-flex justify-content-center align-items-center w-100 h-100">
          <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        </span>
      `);


      const dataToSend = {
          priority: $('#priority').val(),
          name: $('#name').val()
      };
      $.ajax({
          url: '/contracts/api/levels/',
          method: 'POST',
          data: JSON.stringify(dataToSend),
          headers: {
              'X-CSRFToken': getCookie('csrftoken'),
              'Content-Type': 'application/json'  // Явно указываем тип контента
          },
          dataType: 'json',
          statusCode: {
            201: function(result) {
                console.log(result)
                  alertSupporSuccess('Организация успешно создана')
                  $('.create-support-success').on('click', () => {
                    $('#showModalAddSupport').modal('hide')
                    $('#add-support-form')[0].reset();
                    supportTable.ajax.reload(null, false)
                  });
            },
            406: function(result) {
                  alertSupportError(result.responseJSON.error)
            },
            400: function(result) {
              let errorMessage = 'Ошибка HTTP_400_BAD_REQUEST!';
              // Если есть JSON с ошибками
                if (result.responseJSON) {
                    // Собираем все ошибки в один текст
                    const errors = [];
                    for (const field in result.responseJSON) {
                        errors.push(...result.responseJSON[field]);
                    }
                    errorMessage = errors.join('<br>');
                }
                // Если нет JSON, но есть текст
                else if (result.responseText) {
                    try {
                        const json = JSON.parse(result.responseText);
                        errorMessage = json.message || result.responseText;
                    } catch {
                        errorMessage = result.responseText;
                    }
                }

                // Показываем ошибку пользователю
                alertSupportError(errorMessage);
            }
          },

          error: function(e) {
            console.log(e)
            let error = '';
            if(e.status){
              error = 'Статус ошибки - ' + e.status;
            }
            alertSupportError(`Произошла ошибка. Попробуйте еще раз.<br>${error}`)
          },
          complete: function() {
              // Разблокируем кнопку после завершения запроса
              submitButton.prop('disabled', false);
              submitButton.html('Создать'); // Восстанавливаем текст кнопки
          }
      });
    })
  })

    function alertSupporSuccess (text)
    {
      Swal.fire({
          html: '<div class="mt-3">' +
              '<lord-icon src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#0ab39c,secondary:#405189" style="width:120px;height:120px"></lord-icon>' +
              '<div class="mt-4 pt-2 fs-15">' +
              '<h4>Успех !</h4>' +
              `<p class="text-muted mx-4 mb-0">${text}</p>` +
              '</div>' +
              '</div>',
          showCancelButton: true,
          showConfirmButton: false,
          cancelButtonClass: 'btn btn-primary w-xs mb-1 create-support-success',
          cancelButtonText: 'Oк',
          buttonsStyling: false,
          showCloseButton: true
      })
    }

    function alertSupportError(text){
      Swal.fire({
          html: '<div class="mt-3">' +
              '<lord-icon src="https://cdn.lordicon.com/tdrtiskw.json" trigger="loop" colors="primary:#f06548,secondary:#f7b84b" style="width:120px;height:120px"></lord-icon>' +
              '<div class="mt-4 pt-2 fs-15">' +
              '<h4>Упс...! Что то пошло не так!</h4>' +
              `<p class="text-muted mx-4 mb-0">${text}</p>` +
              '</div>' +
              '</div>',
          showCancelButton: true,
          showConfirmButton: false,
          cancelButtonClass: 'btn btn-primary w-xs mb-1 create-support-error',
          cancelButtonText: 'Закрыть',
          buttonsStyling: false,
          showCloseButton: true
      })
    }


</script>
