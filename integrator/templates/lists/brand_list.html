{% load static %}
<div class="col-lg-4">
    <div class="card" id="brandList">
        <div class="card-header border-0">
            <div class="d-flex align-items-center">
                <h5 class="card-title mb-0 flex-grow-1"><b>Бренды</b></h5>
                <div class="flex-shrink-0">
                    <div class="d-flex flex-wrap gap-2">
                        <button class="btn btn-danger add-brand-btn" data-bs-toggle="modal" disabled data-bs-target="#showModalAddBrand"><i class="ri-add-line align-bottom me-1" ></i> Создать</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-body">
                <table class="table table-bordered dt-responsive table-striped align-middle dataTable no-footer dtr-inline" style="width: 100%;" id="brandTable">
                    <thead>
                        <tr>
                            <th>Идентификатор</th>
                            <th>Наименование</th>
                            <th>Действия</th>

                        </tr>
                    </thead>
                    <tbody class="list form-check-all" id="brand-list-data">

                    </tbody>
                    <tbody class="list form-check-all" id="brand-list-data-preloader">
                      <tr>
                          <th><h5 class="card-title placeholder-glow"><span class="placeholder col-12 placeholder-lg"></span></h5></th>
                          <th><h5 class="card-title placeholder-glow"><span class="placeholder col-12 placeholder-lg"></span></h5></th>
                          <th><h5 class="card-title placeholder-glow"><span class="placeholder col-12 placeholder-lg"></span></h5></th>
                      </tr>
                    </tbody>
                </table>
      </div>
        <!--end card-body-->
    </div>
    <!--end card-->
</div>
<script type="text/javascript">

  function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
          document.cookie.split(';').forEach(cookie => {
              cookie = cookie.trim();
              if (cookie.startsWith(name + '=')) {
                  cookieValue = decodeURIComponent(cookie.split('=')[1]);
              }
          });
      }
      return cookieValue;
  }

  function alertDeleteBrandSuccess (text)
  {
    Swal.fire({
        html: '<div class="mt-3">' +
            '<lord-icon src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#0ab39c,secondary:#405189" style="width:120px;height:120px"></lord-icon>' +
            '<div class="mt-4 pt-2 fs-15">' +
            '<h4>Успех !</h4>' +
            `<p class="text-muted mx-4 mb-0">${text}</p>` +
            '</div>' +
            '</div>',
        showCancelButton: true,
        showConfirmButton: false,
        cancelButtonClass: 'btn btn-primary w-xs mb-1 delete-brand-success',
        cancelButtonText: 'Oк',
        buttonsStyling: false,
        showCloseButton: true
    })
  }

  function alertDeleteBrandError(text){
    Swal.fire({
        html: '<div class="mt-3">' +
            '<lord-icon src="https://cdn.lordicon.com/tdrtiskw.json" trigger="loop" colors="primary:#f06548,secondary:#f7b84b" style="width:120px;height:120px"></lord-icon>' +
            '<div class="mt-4 pt-2 fs-15">' +
            '<h4>Упс...! Что то пошло не так!</h4>' +
            `<p class="text-muted mx-4 mb-0">${text}</p>` +
            '</div>' +
            '</div>',
        showCancelButton: true,
        showConfirmButton: false,
        cancelButtonClass: 'btn btn-primary w-xs mb-1 delete-brand-error',
        cancelButtonText: 'Закрыть',
        buttonsStyling: false,
        showCloseButton: true
    })
  }

  let brandTable;
  function initializeBrandTables(){
    brandTable = $('#brandTable').DataTable({
       processing: true,
       serverSide: true,
       searching: true,
       ajax: {
           url: '/equipments/api/brands/datatable/',  // Путь к вашему API
           type: 'GET',
           data: function(d) {
               // Добавление данных для поиска
           },
       },

       columns: [
       { data: 'id' },
       { data: 'name' },
       {
         data: 'id',
         render: function(data, type, row) {
               // Создание ссылки на страницу деталей заявки с использованием id
               return `<div class="dropdown">
                           <button class="btn btn-soft-secondary btn-sm dropdown" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                               <i class="ri-more-fill align-middle"></i>
                           </button>
                           <ul class="dropdown-menu dropdown-menu-end" style="">
                               <li>
                                   <a class="dropdown-item remove-brand-btn" data-delete-brand-id="${row.id}" href="#">
                                       <i class="ri-delete-bin-fill align-bottom me-2 text-muted"></i> Удалить
                                   </a>
                               </li>
                           </ul>
                       </div>`;
         }
       }
       ],
       columnDefs: [
           {
               targets: 0,
               width: "1%",
               className: 'dt-center'
           },
           {
               targets: [1],
               className: 'dt-center'
           },
           {
               targets: 2,
               width: "1%",
               className: 'dt-center'
           }
       ],
       paging: true,
       lengthMenu: [[10, 15, 20, 25, 50], [10, 15, 20, 25, 50]],
       order: [[0, 'default']],
       language: {
           url: '/static/assets/js/table-ru.json'
       },
       stateSave: true, // Сохранение состояния таблицы
       // Убедитесь, что данные возвращаются в правильном формате
       deferRender: true, // Ускоряет при большом количестве данных
       drawCallback: function(settings) {
         $('.add-brand-btn').attr('disabled', false)
         $('#brand-list-data').show()
         $('#brand-list-data-preloader').remove()
       }
   });
  }
  document.addEventListener('DOMContentLoaded', function () {

        initializeBrandTables();
      //  $('#showModalAddOrg').modal('show');
      $(document).on('click', '.remove-brand-btn', function() {
        let brandId = $(this).data('deleteBrandId');
      //  console.log(supportId)
        $.ajax({
            url: '/equipments/api/brands/edit/'+ brandId,
            method: 'DELETE',
            processData: false,
            contentType: false,
            headers: {
                'X-CSRFToken': getCookie('csrftoken')
            },
            dataType: 'json',
            statusCode: {
              200: function(result) {
                  console.log(result)
                    alertDeleteBrandSuccess('Бренд  успешно удален')
                    $('.delete-brand-success').on('click', () => {
                      brandTable.ajax.reload(null, false)
                    });
              },
              406: function(result) {
                    alertDeleteBrandError(result.responseJSON.error)
              },
              400: function(result) {
                let errorMessage = 'Ошибка HTTP_400_BAD_REQUEST!';
                // Если есть JSON с ошибками
                  if (result.responseJSON) {
                      // Собираем все ошибки в один текст
                      const errors = [];
                      for (const field in result.responseJSON) {
                          errors.push(...result.responseJSON[field]);
                      }
                      errorMessage = errors.join('<br>');
                  }
                  // Если нет JSON, но есть текст
                  else if (result.responseText) {
                      try {
                          const json = JSON.parse(result.responseText);
                          errorMessage = json.message || result.responseText;
                      } catch {
                          errorMessage = result.responseText;
                      }
                  }

                  // Показываем ошибку пользователю
                  alertDeleteBrandError(errorMessage);
              },
              403: function(result) {
                let errorMessage = 'Ошибка HTTP_403_BAD_REQUEST!';
                // Если есть JSON с ошибками
                  if (result.responseJSON) {
                      // Собираем все ошибки в один текст
                      const errors = [];
                      for (const field in result.responseJSON) {
                          errors.push(...result.responseJSON[field]);
                      }
                      errorMessage = errors.join('<br>');
                  }
                  // Если нет JSON, но есть текст
                  else if (result.responseText) {
                      try {
                          const json = JSON.parse(result.responseText);
                          errorMessage = json.message || result.responseText;
                      } catch {
                          errorMessage = result.responseText;
                      }
                  }

                  // Показываем ошибку пользователю
                  alertDeleteBrandError(errorMessage);
              },
              405: function(result) {
                let errorMessage = 'Ошибка HTTP_405_BAD_REQUEST!';
                // Если есть JSON с ошибками
                  if (result.responseJSON) {
                      // Собираем все ошибки в один текст
                      const errors = [];
                      for (const field in result.responseJSON) {
                          errors.push(...result.responseJSON[field]);
                      }
                      errorMessage = errors.join('<br>');
                  }
                  // Если нет JSON, но есть текст
                  else if (result.responseText) {
                      try {
                          const json = JSON.parse(result.responseText);
                          errorMessage = json.message || result.responseText;
                      } catch {
                          errorMessage = result.responseText;
                      }
                  }

                  // Показываем ошибку пользователю
                  alertDeleteBrandError(errorMessage);
              }
            },

            error: function(e) {
              console.log(e)
              let error = '';
              if(e.status){
                error = 'Статус ошибки - ' + e.status;
              }
              alertDeleteBrandError(`Произошла ошибка. Попробуйте еще раз.<br>${error}`)
            },
            complete: function() {
            }
        });
      })
    });

</script>
