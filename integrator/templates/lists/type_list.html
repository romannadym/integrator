{% load static %}
<div class="col-lg-4">
    <div class="card" id="typetList">
        <div class="card-header border-0">
            <div class="d-flex align-items-center">
                <h5 class="card-title mb-0 flex-grow-1"><b>Типы оборудования</b></h5>
                <div class="flex-shrink-0">
                    <div class="d-flex flex-wrap gap-2">
                        <button class="btn btn-danger add-type-btn" data-bs-toggle="modal" disabled data-bs-target="#showModalAddType"><i class="ri-add-line align-bottom me-1" ></i> Создать</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="card-body">
                <table class="table table-bordered dt-responsive table-striped align-middle dataTable no-footer dtr-inline" style="width: 100%;" id="typeTable">
                    <thead>
                        <tr>
                            <th>Идентификатор</th>
                            <th>Наименование</th>
                            <th>Действие</th>

                        </tr>
                    </thead>
                    <tbody class="list form-check-all" id="type-list-data">

                    </tbody>
                    <tbody class="list form-check-all" id="type-list-data-preloader">
                      <tr>
                          <th><h5 class="card-title placeholder-glow"><span class="placeholder col-12 placeholder-lg"></span></h5></th>
                          <th><h5 class="card-title placeholder-glow"><span class="placeholder col-12 placeholder-lg"></span></h5></th>
                          <th><h5 class="card-title placeholder-glow"><span class="placeholder col-12 placeholder-lg"></span></h5></th>
                      </tr>
                    </tbody>
                </table>
      </div>
        <!--end card-body-->
    </div>
    <!--end card-->
</div>
<script type="text/javascript">
  let typeTable;
  function initializeTypetTables(){
    typeTable = $('#typeTable').DataTable({
       processing: true,
       serverSide: true,
       searching: true,
       ajax: {
           url: '/equipments/api/types/datatable/',  // Путь к вашему API
           type: 'GET',
           data: function(d) {
               // Добавление данных для поиска
           },
       },

       columns: [
       { data: 'id' },
       { data: 'name' },
       {
         data: 'id',
         render: function(data, type, row) {
               // Создание ссылки на страницу деталей заявки с использованием id
               return `<div class="dropdown">
                           <button class="btn btn-soft-secondary btn-sm dropdown" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                               <i class="ri-more-fill align-middle"></i>
                           </button>
                           <ul class="dropdown-menu dropdown-menu-end" style="">
                               <li>
                                   <a class="dropdown-item remove-item-btn" data-delete-type-id="${row.id}" href="#">
                                       <i class="ri-delete-bin-fill align-bottom me-2 text-muted"></i> Удалить
                                   </a>
                               </li>
                           </ul>
                       </div>`;
         }
       }
       ],
       columnDefs: [
         {
             targets: 0,
             width: "1%",
             className: 'dt-center'
         },
         {
             targets: [1],
             className: 'dt-center'
         },
         {
             targets: 2,
             width: "1%",
             className: 'dt-center'
         }
       ],
       paging: true,
       lengthMenu: [[10, 15, 20, 25, 50], [10, 15, 20, 25, 50]],
       order: [[0, 'default']],
       language: {
           url: '/static/assets/js/table-ru.json'
       },
       stateSave: true, // Сохранение состояния таблицы
       // Убедитесь, что данные возвращаются в правильном формате
       deferRender: true, // Ускоряет при большом количестве данных
       drawCallback: function(settings) {
         $('.add-type-btn').attr('disabled', false)
         $('#type-list-data').show()
         $('#type-list-data-preloader').remove()
       }
   });
  }
  document.addEventListener('DOMContentLoaded', function () {

      initializeTypetTables();
    //  $('#showModalAddOrg').modal('show');
    });

</script>
