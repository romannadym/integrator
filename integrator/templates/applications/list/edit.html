{% load static %}
<div class="modal fade zoomIn" id="showModalEditTicket" tabindex="-1" aria-labelledby="editOrder" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0">
            <div class="modal-header p-3 bg-info-subtle">
                <h5 class="modal-title" id="exampleModalLabel"></h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="close-modal"></button>
            </div>
            <form method="PUT" class="tablelist-form" autocomplete="off" id="edit-ticket-form">
                {% csrf_token %}
                <div class="modal-body">
                    <div class="row g-3">
                        <!--end col-->
                        <div class="col-lg-12">
                            <h6 class="fw-semibold">Приоритет заявки:</h6>
                            <select class="js-example-basic-single" name="priority" id="id_priority_edit" required>
                                <option value=""></option>
                            </select>
                        </div>
                        <!--end col-->
                        <div class="col-lg-12">
                            <h6 class="fw-semibold">Оборудование:</h6>
                            <select class="js-example-basic-single" name="equipment_str" id="id_equipment_edit" required>
                                <option value=""></option>
                            </select>
                        </div>
                        <!--end col-->
                        <div class="col-lg-12">
                            <h6 class="fw-semibold">Описание проблемы:</h6>
                            <textarea class="form-control" name="problem" id="problem_field_edit" rows="3" required></textarea>
                        </div>

                    </div>
                    <!--end row-->
                </div>
                <div class="modal-footer">
                    <div class="hstack gap-2 justify-content-end">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Закрыть</button>
                        <button type="submit" class="btn btn-success" id="updateTicket">Сохранить</button>
                        <!-- <button type="button" class="btn btn-success" id="edit-btn">Update Task</button> -->
                    </div>
                </div>
                <input type="hidden" name="documents-TOTAL_FORMS" value="1" id="id_documents-TOTAL_FORMS">
                <input type="hidden" name="documents-INITIAL_FORMS" value="0" id="id_documents-INITIAL_FORMS">
                <input type="hidden" name="documents-MIN_NUM_FORMS" value="0" id="id_documents-MIN_NUM_FORMS">
                <input type="hidden" name="documents-MAX_NUM_FORMS" value="1000" id="id_documents-MAX_NUM_FORMS">
            </form>
        </div>
    </div>
</div>
<!--end modal-->
<script type="text/javascript">
$(document).ready(function () {

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            document.cookie.split(';').forEach(cookie => {
                cookie = cookie.trim();
                if (cookie.startsWith(name + '=')) {
                    cookieValue = decodeURIComponent(cookie.split('=')[1]);
                }
            });
        }
        return cookieValue;
    }

    $.ajax({
        url: '/applications/api/add/',
        type: 'GET',
        success: function(data) {
          if(data.priorities){
            data.priorities.forEach(function(item) {
                $('#id_priority_edit').append(`<option value="${item.id}">${item.name}</option>`)
            })
          }
        }
    });

    $('#id_priority_edit').select2({
      dropdownParent: $('#showModalEditTicket'),
      placeholder: "-------"
    });

    $('#id_equipment_edit').select2({
      dropdownParent: $('#showModalEditTicket'),
      placeholder: "-------"
    });

    $('#showModalEditTicket').on('show.bs.modal', function (event) {
       const button = $(event.relatedTarget); // Кнопка, что вызвала модал
       const itemId = button.data('editId');      // Получаем data-edit-id
       const itemStatusId = button.data('editStatusId');
       const itemEngineerId = button.data('editEngineerId');
       const itemPriorityId = button.data('editPriorityId');      // Получаем data-edit-row
       const itemEquipmentName = button.data('editEquipmentName')
       const itemProblem = button.data('editProblem')
       const itemOrganizationUserId = button.data('editOrganizationUserId')
       const modal = $(this);
          // Если хочешь вставить ID в заголовок или текст:
          modal.find('h5').text(`Редактирование заявки #${itemId}`);
          modal.find('#problem_field_edit').val(itemProblem);
          $('#id_priority_edit').val(itemPriorityId).trigger('change');
          EquipmentListEdit(itemOrganizationUserId, itemEquipmentName)

        $('#updateTicket').off('click').on('click', (evn) => {
          evn.preventDefault();
          // Блокируем кнопку отправки
          let submitButton = $('#updateTicket'); // Убедитесь, что у кнопки отправки есть id='submit-button'
          submitButton.prop('disabled', true);
          // Сохраняем текст, если надо восстановить потом
          let originalText = submitButton.html();

          // Блокируем и добавляем фиксированные размеры
          let buttonWidth = submitButton.outerWidth();
          let buttonHeight = submitButton.outerHeight();

          submitButton.prop('disabled', true).css({
            width: buttonWidth,
            height: buttonHeight
          }).html(`
            <span class="d-flex justify-content-center align-items-center w-100 h-100">
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            </span>
          `);
          let data = {
              priority: $('#id_priority_edit').val(),
              problem: $('#problem_field_edit').val(),
              equipment_str: $('#id_equipment_edit').val(),
              status: itemStatusId
          };

          if (itemEngineerId) {
              data.engineer = itemEngineerId; // добавляем engineer, если есть значение
          }
          updateApplication(itemId, data, modal,submitButton, ticketTable, originalText)
        })

    })

    $('#showModalEditTicket').on('hidden.bs.modal', function () {
        // Очищаем обычные поля input и textarea
        $(this).find('form')[0].reset();
        // Очищаем Select2 поля
        $('#id_priority_edit').val(null).trigger('change');
        $('#id_equipment_edit').val(null).trigger('change');
        $('#problem_field_edit').val(null).trigger('change');
    });

    function EquipmentListEdit(client_id, equipment_name) {
        if ( !client_id) return;

        $.ajax({
            url: '/applications/add/',
            method: 'POST',
            data: { client: client_id, sn: '' },
            headers: { 'X-CSRFToken': getCookie('csrftoken') },
            dataType: 'json',
            success: function(result) {
                $('#id_equipment_edit').empty()
                result.forEach(function (item){
                  let equipment  = `${item.equipment__brand__name} ${item.equipment__model__name} (S/n: ${item.sn})`

                  equipment_name =  equipment_name.replace(/<br\s*\/?>/gi, '').trim();
                  const selected = equipment === equipment_name ? 'selected' : '';
                  $('#id_equipment_edit').append(`<option value="${equipment}" ${selected}>${equipment}</option>`)
                })

            }
        });
    }

    function updateApplication(itemId, data, modal,submitButton, ticketTable, originalText) {
        $.ajax({
            url: `/applications/api/edit/${itemId}`,
            method: 'PUT',
            data: JSON.stringify(data),
            headers: {
              'X-CSRFToken': getCookie('csrftoken') ,
              'Content-Type': 'application/json',
            },
            statusCode: {
                  200: function (result) {
                    modal.modal('hide');
                    alertSuccess(`Заявка #${itemId} от редактирована!`);
                    $('.edit-ticket-success').on('click', () => ticketTable.ajax.reload(null, false));
                  },
                  403: function(result) {
                      alertError('Ошибка 403!')
                  },
                  400: function(result) {
                      alertError('Ошибка 400!')
                  },
                  406: function(result) {
                      console.log('Ошибка 406!')
                  }

            },
            error: function(e) {
              console.log(e)
            },
            complete: function () {
              submitButton.prop('disabled', false);
              submitButton.html(originalText); // Восстанавливаем текст кнопки
            }
        });
    }

    function alertSuccess (text)
    {
      Swal.fire({
          html: '<div class="mt-3">' +
              '<lord-icon src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#0ab39c,secondary:#405189" style="width:120px;height:120px"></lord-icon>' +
              '<div class="mt-4 pt-2 fs-15">' +
              '<h4>Успех !</h4>' +
              `<p class="text-muted mx-4 mb-0">${text}</p>` +
              '</div>' +
              '</div>',
          showCancelButton: true,
          showConfirmButton: false,
          cancelButtonClass: 'btn btn-primary w-xs mb-1 edit-ticket-success',
          cancelButtonText: 'Oк',
          buttonsStyling: false,
          showCloseButton: true
      })
    }
    function alertError(text){
      Swal.fire({
          html: '<div class="mt-3">' +
              '<lord-icon src="https://cdn.lordicon.com/tdrtiskw.json" trigger="loop" colors="primary:#f06548,secondary:#f7b84b" style="width:120px;height:120px"></lord-icon>' +
              '<div class="mt-4 pt-2 fs-15">' +
              '<h4>Упс...! Что то пошло не так!</h4>' +
              `<p class="text-muted mx-4 mb-0">${text}</p>` +
              '</div>' +
              '</div>',
          showCancelButton: true,
          showConfirmButton: false,
          cancelButtonClass: 'btn btn-primary w-xs mb-1 edit-ticket-error',
          cancelButtonText: 'Закрыть',
          buttonsStyling: false,
          showCloseButton: true
      })
    }
})

</script>
