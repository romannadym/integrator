{% load static %}
{% block pagecss %}
<!-- dropzone css -->
<link rel="stylesheet" href="/static/assets/libs/dropzone/dropzone.css" type="text/css" />

<!-- Filepond css -->
<link rel="stylesheet" href="/static/assets/libs/filepond/filepond.min.css" type="text/css" />
<link rel="stylesheet" href="/static/assets/libs/filepond-plugin-image-preview/filepond-plugin-image-preview.min.css">
{% endblock %}
<div class="modal fade zoomIn" id="showModalUploadFiles" tabindex="-1" aria-labelledby="editOrder" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0">
            <div class="modal-header p-3 bg-info-subtle">
                <h5 class="modal-title" id="exampleModalLabel">Загрузка файлов</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close" id="close-modal"></button>
            </div>
                <div class="modal-body">
                    <div class="row g-3">
                      <div class="col-lg-12">
                          <div class="card">

                              <div class="card-body">
                                    <p class="text-muted">Возможна загрузка только текстовых форматов, архивов, изображений.<br>Размер одного загружаемого файла не должен превышать 50 мегабайт</p>
                                  <input type="file" class="filepond filepond-input-multiple" multiple name="filepond" data-allow-reorder="true" data-max-file-size="50MB" data-max-files="50">
                                  <input type="hidden" name="uploaded_files" id="uploaded-files">
                                  <input type="hidden" name="application_id" value="{{ data.application.id }}">
                              </div>
                              <!-- end card body -->
                          </div>
                          <!-- end card -->
                      </div> <!-- end col -->

                    </div>
                    <!--end row-->
                </div>
                <div class="modal-footer">
                    <div class="hstack gap-2 justify-content-end">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Закрыть</button>
                        <button type="button" class="btn btn-success" id="t-f-upload">Сохранить</button>
                        <!-- <button type="button" class="btn btn-success" id="edit-btn">Update Task</button> -->
                    </div>
                </div>
        </div>
    </div>
</div>
<script type="text/javascript">
  $(document).ready(function() {
          $('#t-f-upload').on('click',function () {
              uploadFiles()
          })
          $('#showModalUploadFiles').on('hidden.bs.modal', function () {
              // Очистка временных файлов
              if (uploadedFiles.length > 0) {
                  fetch('/applications/api/clear-temp/', {
                      method: 'POST',
                      headers: {
                          'Content-Type': 'application/json',
                          'X-CSRFToken': getCookie('csrftoken'),
                      },
                      body: JSON.stringify({ files: uploadedFiles })
                  }).then(() => {
                      uploadedFiles = []; // сбросим массив
                      document.getElementById("uploaded-files").value = '';

                  });
              }
              // Очистка FilePond
              pondInstances.forEach((pond) => pond.removeFiles());
          });

          FilePond.registerPlugin(
              // encodes the file as base64 data
              FilePondPluginFileEncode,
              // validates the size of the file
              FilePondPluginFileValidateSize,
              // corrects mobile image orientation
              FilePondPluginImageExifOrientation,
              // previews dropped images
              FilePondPluginImagePreview
          );
          var inputMultipleElements = document.querySelectorAll('input.filepond-input-multiple');
          const pondInstances = []; // <-- добавили
          var uploadedFiles = [];
          if(inputMultipleElements){
          // loop over input elements

          Array.from(inputMultipleElements).forEach(function (inputElement) {
            FilePond.setOptions({
              labelIdle: 'Перетащите файл или <span class="filepond--label-action">Выберите</span>',
              labelMaxFileSizeExceeded: 'Файл слишком большой',
              labelMaxFileSize: 'Максимальный размер файла: {filesize}',
              server: {
                process: {
                    url: '/applications/api/upload/',
                    onload: (res) => {
                        const result = JSON.parse(res);
                        uploadedFiles.push(result.id);
                        document.getElementById("uploaded-files").value = JSON.stringify(uploadedFiles);
                        return result.id;
                    }
                },
                revert: (uniqueFileId, load, error) => {
                    fetch('/applications/api/revert/', {
                        method: 'DELETE',
                        body: uniqueFileId,
                        headers: {
                          'X-CSRFToken': getCookie('csrftoken')  // для Django CSRF
                        }
                    }).then(() => {
                        // Удалить из массива
                        const index = uploadedFiles.indexOf(uniqueFileId);
                        if (index > -1) uploadedFiles.splice(index, 1);
                        document.getElementById("uploaded-files").value = JSON.stringify(uploadedFiles);
                        load();
                    }).catch(error);
                },
                headers: {
                  'X-CSRFToken': getCookie('csrftoken')  // для Django CSRF
                }
            }
              // остальной перевод как выше...
            });
              // create a FilePond instance at the input element location
              const pond = FilePond.create(inputElement); // <-- сохраняем
              pondInstances.push(pond); // <-- сохраняем
          })
          }
  })
 function uploadFiles (){
   // Блокируем кнопку отправки
   let submitButton = $('#t-f-upload'); // Убедитесь, что у кнопки отправки есть id='submit-button'
   submitButton.prop('disabled', true);
   // Сохраняем текст, если надо восстановить потом
   let originalText = submitButton.html();

   // Блокируем и добавляем фиксированные размеры
   let buttonWidth = submitButton.outerWidth();
   let buttonHeight = submitButton.outerHeight();

   submitButton.prop('disabled', true).css({
     width: buttonWidth,
     height: buttonHeight
   }).html(`
     <span class="d-flex justify-content-center align-items-center w-100 h-100">
       <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
     </span>
   `);
   let formData = {
     application_id: $('input[name=application_id]').val(),
     uploaded_files: $('input[name=uploaded_files]').val()
   };
   $.ajax({
       url: '/applications/api/documents/upload/',
       method: 'POST',
       contentType: 'application/json',
       data: JSON.stringify(formData),
       headers: {
         'X-CSRFToken': getCookie('csrftoken')
       },
       statusCode: {
             200: function (result) {
               $('#showModalUploadFiles').modal('hide');
              location.reload();
             },
             403: function(result) {
                 alertError('Ошибка 403!')
             },
             400: function(result) {
                 alertError('Ошибка 400!')
             },
             406: function(result) {
                 console.log('Ошибка 406!')
             }

       },
       error: function(e) {
         console.log(e)
         let error = '';
         if(e.status){
           error = 'Статус ошибки - ' + e.status;
         }
         alertError(`Произошла ошибка. Попробуйте еще раз.<br>${error}`)
       },
       complete: function() {
           // Разблокируем кнопку после завершения запроса
           submitButton.prop('disabled', false);
           submitButton.html(originalText); // Восстанавливаем текст кнопки
       }
   });
 }
</script>
