{% load static %}
<div class="tab-pane" id="changePassword" role="tabpanel">
    <form action="javascript:void(0);">
        <div class="row g-2">
          {% if not permissions.is_admin %}
            <div class="col-lg-4">
                <div>
                    <label for="oldPassword" class="form-label">Старый пароль</label>
                    <input type="password" class="form-control" id="oldPassword" placeholder="Введите старый пароль">
                </div>
            </div>
          <!--end col-->
          {% endif %}
            <div class="col-lg-4">
                <div>
                    <label for="newpasswordInput1" class="form-label">Новый пароль</label>
                    <input type="password" class="form-control" id="newpasswordInput1" placeholder="Введите пароль">
                </div>
            </div>
            <!--end col-->
            <div class="col-lg-4">
                <div>
                    <label for="confirmpasswordInput" class="form-label">Подтвердите пароль</label>
                    <input type="password" class="form-control" id="confirmpasswordInput" placeholder="Повторите пароль">
                </div>
            </div>
            <!--end col-->
            <div class="col-lg-12">
                <div class="text-end">
                    <button type="button" class="btn btn-success"  id="changePass">Сохранить</button>
                </div>
            </div>
            <!--end col-->
        </div>
        <!--end row-->
    </form>
</div>
<!--end tab-pane-->
<script type="text/javascript">
  function getCookie(name) {
      let cookieValue = null;
      if (document.cookie && document.cookie !== '') {
          document.cookie.split(';').forEach(cookie => {
              cookie = cookie.trim();
              if (cookie.startsWith(name + '=')) {
                  cookieValue = decodeURIComponent(cookie.split('=')[1]);
              }
          });
      }
      return cookieValue;
  }
{% if permissions.is_admin %}
  function changePass()
  {
      var path = window.location.pathname;
      var userId = path.split('/').pop();
      let submitButton = $('#changePass'); // Убедитесь, что у кнопки отправки есть id='submit-button'
      submitButton.prop('disabled', true);
      // Сохраняем текст, если надо восстановить потом
      let originalText = submitButton.html();

      // Блокируем и добавляем фиксированные размеры
      let buttonWidth = submitButton.outerWidth();
      let buttonHeight = submitButton.outerHeight();

      submitButton.prop('disabled', true).css({
        width: buttonWidth,
        height: buttonHeight
      }).html(`
        <span class="d-flex justify-content-center align-items-center w-100 h-100">
          <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        </span>
      `);
      let jsonData = {};
      jsonData.password1 = $('#newpasswordInput1').val(); // true/false
      jsonData.password2 = $('#confirmpasswordInput').val(); // true/false
      $.ajax({
          url: '/api/admin/password/'+userId,
          method: 'PUT',
          data: JSON.stringify(jsonData),
          headers: {
            'X-CSRFToken': getCookie('csrftoken'),
            'Content-Type': 'application/json',
           },
           statusCode: {
             200: function(result) {
                 console.log(result)
                   alertSuccess('Пароль успешно изменен')
                   $('.update-pass-success').on('click', () => {
                     $('#newpasswordInput1').val('')
                     $('#confirmpasswordInput').val('')
                   });
             },
             400: function(result) {
               let errorMessage = 'Ошибка HTTP_400_BAD_REQUEST!';
               // Если есть JSON с ошибками
                 if (result.responseJSON) {
                     // Собираем все ошибки в один текст
                     const errors = [];
                     for (const field in result.responseJSON) {
                         errors.push(...result.responseJSON[field]);
                     }
                     errorMessage = errors.join('<br>');
                 }
                 // Если нет JSON, но есть текст
                 else if (result.responseText) {
                     try {
                         const json = JSON.parse(result.responseText);
                         errorMessage = json.message || result.responseText;
                     } catch {
                         errorMessage = result.responseText;
                     }
                 }

                 // Показываем ошибку пользователю
                 alertError(errorMessage);
             },
             406: function(result) {
               let errorMessage = 'Ошибка HTTP_406_BAD_REQUEST!';
               // Если есть JSON с ошибками
                 if (result.responseJSON) {
                     // Собираем все ошибки в один текст
                     const errors = [];
                     for (const field in result.responseJSON) {
                         errors.push(...result.responseJSON[field]);
                     }
                     errorMessage = errors.join('<br>');
                 }
                 // Если нет JSON, но есть текст
                 else if (result.responseText) {
                     try {
                         const json = JSON.parse(result.responseText);
                         errorMessage = json.message || result.responseText;
                     } catch {
                         errorMessage = result.responseText;
                     }
                 }

                 // Показываем ошибку пользователю
                 alertError(errorMessage);
             }

           },
          error: function(e) {
            console.log(e)
            let status = '';
            if(e.status){
              status = 'Статус ошибки - ' + e.status;
            }
            let detail = '';
            if(e.responseJSON)
            {
              detail = e.responseJSON.detail;
            }
            alertError(`${status}<br>${detail}`)
          },
          complete: function() {
            submitButton.prop('disabled', false);
            submitButton.html(originalText); // Восстанавливаем текст кнопки
          }
      });
  }

  function alertSuccess (text)
  {
    Swal.fire({
        html: '<div class="mt-3">' +
            '<lord-icon src="https://cdn.lordicon.com/lupuorrc.json" trigger="loop" colors="primary:#0ab39c,secondary:#405189" style="width:120px;height:120px"></lord-icon>' +
            '<div class="mt-4 pt-2 fs-15">' +
            '<h4>Успех !</h4>' +
            `<p class="text-muted mx-4 mb-0">${text}</p>` +
            '</div>' +
            '</div>',
        showCancelButton: true,
        showConfirmButton: false,
        cancelButtonClass: 'btn btn-primary w-xs mb-1 update-pass-success',
        cancelButtonText: 'Oк',

        showCloseButton: true
    })
  }

  }
  $(document).ready(function () {

</script>
